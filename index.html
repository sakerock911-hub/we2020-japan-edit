2015-16-ado-den-haag","ariajasuru-hasegawa-2013-fc-tokyo"],"changes":["第2回：柿谷曜一朗2013・ハーフナー マイク2015–16・長谷川アーリアジャスール2013を追加。全13人。","既存10人の全項目・数値・画像・登録順を保持。","全25能力・逆足等4項目・適性・スキル・外見を個別作成。能力は独自査定、実機未確認の外見は仮設定。","各選手の正面・横顔AI参考画像を追加。実機の再現結果ではない。","長谷川の長い名前は「長谷川／アーリア／ジャスール」の意味の区切りで折り返せるよう対応。","既存の写真表示、年表示なし、確認事項非表示、余白の修正を維持。"]}],"handoff_documents":[{"filename":"ishikawa_2009_edit_handoff.md","player_id":"naohiro-ishikawa-2009-fc-tokyo","content":"# 石川直宏｜2009年・FC東京\n## PS4版「ウイニングイレブン2020」選手エディット引き継ぎ資料\n\nこのファイルは、前チャットで提示した石川直宏の設定を、**数値を変更せずに転記した資料**です。別のWorkで作る選手エディット図鑑の初期データとして使用してください。今回の転記にあたり、Webでの再調査やPS4実機での再現確認は行っていません。\n\n## 引き継ぎ先への指示\n\n本資料の石川直宏・2009年版を、既存の選手を残したまま図鑑へ登録してください。能力値・ポジション適性・スタイル・スキルは「独自査定」、体形と顔の調整値は「実機未確認の仮案」と表示してください。未確認の顔パーツ番号や総合値を推測で埋めないでください。画像は同梱していないため、完成見本の欄は「完成見本未登録」としてください。\n\n同梱可能な別ファイル `ishikawa_2009_edit_data.json` は、本資料と同じ設定を構造化したデータです。特定サービス専用の自動インポート形式ではなく、サイト制作時に読み込んで利用するための汎用JSONです。\n\n## 1．再現時期と選定理由\n\n| 項目 | 内容 |\n| --- | --- |\n| 再現年度 | 2009年 |\n| 当時の所属チーム | FC東京 |\n| 基準時期 | 10月の負傷前までの好調時 |\n| 選定理由 | J1で24試合15得点、ベストイレブン選出。持ち前のスピードとドリブルに加え、得点力が際立った時期として前チャットで採用。 |\n| 再現の軸 | スピードとドリブルに加え、ゴール前への飛び出しと得点力が際立つ右サイドのアタッカー |\n\n成績や当時のプロフィールは、前チャットで参照された資料に基づく記載を引き継いでいます。出典は末尾に掲載していますが、この転記時点では再検証していません。\n\n## 2．基本設定\n\n| 項目 | 入力内容 |\n| --- | --- |\n| 選手名 | 石川 直宏 |\n| 読みがな（図鑑の並べ替え用） | いしかわ なおひろ |\n| 英語表記 | NAOHIRO ISHIKAWA |\n| ユニフォームネーム | ISHIKAWA |\n| 国籍 | 日本 |\n| 再現当時の所属チーム | FC東京 |\n| 年齢 | 28歳 |\n| 身長 | 175cm |\n| 体重 | 69kg |\n| 利き足 | 右 |\n| 登録ポジション | RMF |\n| 背番号 | 18 |\n\n年齢は2009年版の再現設定として28歳に固定しています。現役後年のプロフィールではなく、前チャットで採用した当時の身長・体重を使用しています。\n\n## 3．ポジション適性【独自設定】\n\n| ポジション | 設定 |\n| --- | --- |\n| RMF | 適性あり・メイン |\n| RWG | 適性あり |\n| LMF | 準適性 |\n| ST | 準適性 |\n| その他 | なし |\n\n基本的な起用位置は、4-4-2の右サイドハーフを想定しています。\n\n## 4．能力値【独自査定】\n\n以下は公式ゲームデータの転載ではなく、2009年の好調時を再現するために前チャットで提示した独自査定です。今回、数字は変更していません。\n\n| 能力項目 | 入力値 |\n| --- | --- |\n| オフェンスセンス | 82 |\n| ボールコントロール | 81 |\n| ドリブル | 84 |\n| ボールキープ | 78 |\n| グラウンダーパス | 75 |\n| フライパス | 77 |\n| 決定力 | 82 |\n| ヘディング | 63 |\n| プレースキック | 70 |\n| カーブ | 78 |\n| スピード | 87 |\n| 瞬発力 | 89 |\n| キック力 | 80 |\n| ジャンプ | 68 |\n| フィジカルコンタクト | 68 |\n| ボディコントロール | 82 |\n| スタミナ | 82 |\n| ディフェンスセンス | 51 |\n| ボール奪取 | 53 |\n| アグレッシブネス | 66 |\n| GKセンス | 40 |\n| キャッチング | 40 |\n| クリアリング | 40 |\n| コラプシング | 40 |\n| ディフレクティング | 40 |\n\n### 逆足・コンディションなど\n\n| 項目 | 入力値 |\n| --- | --- |\n| 逆足頻度 | 3 |\n| 逆足精度 | 3 |\n| コンディション安定度 | 7 |\n| ケガ耐性 | 1 |\n\n**査定の狙い：** スピード87・瞬発力89・ドリブル84・決定力82を軸に、自分で仕掛けて得点できる選手にします。パスやフィジカルまで高くしすぎず、得意分野をはっきりさせる方針です。\n\n**ケガ耐性：** 2005年と2009年の大きな負傷歴を踏まえた前チャットの査定です。プレー能力は好調時を再現し、ケガ耐性とは分けて設定しています。負傷歴の記載も今回の再調査は未実施です。\n\n**総合値：未計算。** 実機で計算していないため、図鑑では推定の総合値を確定値として表示しないでください。\n\n## 5．プレースタイル・スキル【独自設定】\n\n### プレースタイル\n\n| 項目 | 設定 |\n| --- | --- |\n| プレースタイル | 2列目からの飛び出し |\n\nサイドからのクロスだけでなく、右サイドからゴール前へ入って得点する2009年版を重視した設定です。\n\n### 選手スキル\n\n| 付けるスキル | 再現したい要素 |\n| --- | --- |\n| ワンタッチシュート | 少ないタッチでシュートへ持ち込む仕上げ |\n| ミドルシュート | エリア外からもゴールを狙える攻撃力 |\n| コントロールカーブ | コースを狙うシュートの表現 |\n| アウトスピンキック | アウトサイドを使ったキックの表現 |\n\nまずは上の4つだけを付ける案です。その他のスキルは追加しません。\n\n### COMプレースタイル\n\n| 項目 | 設定 |\n| --- | --- |\n| ダーティングドリブラー | ON |\n| インサイドカッター | ON |\n| ミドルシューター | ON |\n| その他 | OFF |\n\n## 6．ボディ【身長・体重以外は実機未確認の仮案】\n\n細身にしつつ、脚まで極端に細くしない方向の設定です。身長・体重以外は写真を参考にした見た目用の仮設定として引き継ぎます。\n\n| 項目 | 入力値 |\n| --- | --- |\n| 身長 | 175cm |\n| 体重 | 69kg |\n| 首の長さ | 0 |\n| 首の太さ | −1 |\n| 肩の高さ | 0 |\n| 肩幅 | −1 |\n| 胸の厚さ | 0 |\n| 腰の太さ | −2 |\n| 腕の太さ | −1 |\n| フトモモの太さ | ＋1 |\n| ふくらはぎの太さ | 0 |\n| 足の長さ | 0 |\n| 腕の長さ | 0 |\n\n## 7．顔【実機未確認の仮案】\n\n**重要：この顔設定は、上から入力すれば本人に似た顔が完成する、検証済みのレシピではありません。** 顔パーツの種類番号は未確定です。数値は、似せていくための出発点として前チャットで提示したものです。\n\n### 選ぶパーツの特徴\n\nやや縦長の輪郭、細めの目、比較的まっすぐな眉、口元からあごにかけてのすっきりした形を狙います。\n\n| パーツ | 選ぶ形の目安 |\n| --- | --- |\n| 肌 | 少し日焼けした自然な肌色 |\n| 上まぶた | 二重の線が強すぎず、細めの目になるもの |\n| 下まぶた | ふくらみが強すぎないもの |\n| 瞳 | 黒に近いこげ茶 |\n| 眉 | 角度がきつすぎない、比較的まっすぐな形 |\n| 鼻 | 鼻筋が極端に高くなく、鼻先に少し丸みがある形 |\n| 上唇 | やや薄め |\n| 下唇 | 上唇より少し厚みがある形 |\n| 頬 | 丸くふっくらしすぎない形 |\n| あご | 極端に尖らず、やや細くなる形 |\n\n### 顔の数値調整・仮案\n\n上の特徴に近いパーツを選び、調整値を0に戻したところから試す開始値です。ただし、項目名・入力範囲・0を選択できるかは実機未照合です。実際の画面と異なる箇所は推測で対応させず、未確認として残してください。\n\n| 設定画面 | 項目 | 仮の入力値 |\n| --- | --- | --- |\n| 肌の色／頭部の比率 | 頭の長さ | ＋2 |\n| 肌の色／頭部の比率 | 頭の幅 | −1 |\n| 肌の色／頭部の比率 | 頭の奥行き | 0 |\n| 肌の色／頭部の比率 | 顔の縦位置 | 0 |\n| 肌の色／頭部の比率 | 顔の大きさ | 0 |\n| 目 | 瞳の大きさ | −1 |\n| 額／眉 | 眉の太さ | ＋1 |\n| 額／眉 | 眉の濃さ | ＋1 |\n| 口 | 唇の縦幅 | −1 |\n| 口 | 唇の横幅 | ＋1 |\n| ほお／あご／エラ | ほお骨の張り | ＋1 |\n| ほお／あご／エラ | あごの横幅 | −1 |\n| ほお／あご／エラ | エラの張り | −1 |\n\n記載していない細部の数値調整は、前チャットではひとまず0とする案でした。これは0を選べる調整項目に限り、未記載のパーツ種類番号を0とする指示ではありません。まず輪郭と髪型を合わせ、目や鼻の位置を最初から大きく動かさない方針です。\n\n## 8．髪型【当時の見た目を基にした設定案】\n\n**狙う髪型：長めの黒髪＋細い黒のヘアバンド。** 額を出して後ろへ流し、耳の後ろと襟足に髪を残します。短髪・刈り上げにはしません。パーツの種類番号や各選択肢は実機未確認です。\n\n| 項目 | 設定案 |\n| --- | --- |\n| 全体の形状 | 通常 |\n| 長さ | ミディアムを出発点にする |\n| ウェーブレベル | ＋1 |\n| 前髪の形状 | バック |\n| 分け目 | 強い分け目が目立たないもの |\n| おでこの幅 | 普通 |\n| 横・後ろ | 刈り上げず、襟足に長さを残す |\n| 髪の色 | 黒に近い暗い茶色 |\n| アクセサリー | 細いヘアバンドに近いもの |\n| アクセサリーの色 | 黒 |\n\n## 9．ヒゲ・着こなし【見た目の再現用設定案】\n\n| 項目 | 設定案 |\n| --- | --- |\n| ヒゲの形 | 口ヒゲ＋あご先に薄く入るもの |\n| ヒゲの色 | 黒に近い暗い茶色 |\n| ヒゲの濃さ | 薄め。頬まで覆う濃いヒゲにはしない |\n| 袖 | 半袖 |\n| シャツの裾 | パンツに入れる |\n| ソックス | 標準 |\n| スパイク | 明るい青系＋黒の配色に近いもの |\n\nヒゲのパーツ番号とスパイクの特定モデルは指定していません。近い見た目のものを選ぶための案です。\n\n## 10．完成見本画像の扱い\n\nこの引き継ぎ資料には、実機スクリーンショットもAI生成画像も含まれていません。現時点では「完成見本未登録」と表示してください。後日、この設定で実際に作った正面・横顔のスクリーンショットを登録し、必要に応じて顔の設定値を調整する運用を想定しています。\n\nAIでゲーム風の画像を作成する場合は、必ず「参考イメージ・実機の再現結果ではありません」と表示してください。この数値から実機の顔を正確に生成した画像として扱わないでください。\n\n## 11．図鑑サイトに引き継ぐ補助情報\n\n| 項目 | 内容 |\n| --- | --- |\n| データID | naohiro-ishikawa-2009-fc-tokyo |\n| 一覧カード | 顔画像、石川 直宏、2009年、FC東京、RMF |\n| 五十音順のキー | いしかわ なおひろ |\n| 所属チームの基準 | 再現当時のFC東京。現所属ではない |\n| 同一選手の別年度版 | 別データとして追加可能な設計にする |\n| 閲覧用途 | スマートフォンをPS4の横に置き、数値を見ながら手入力 |\n| データ更新 | 既存選手を残して追加・修正する |\n| 画像未登録時 | 完成見本未登録 |\n\n一覧は、読みがなによる五十音順、再現当時の所属チームでの並べ替え・絞り込み、名前検索、ポジション絞り込み、追加順表示に対応する想定です。詳細ページは、基本情報→ポジション→能力値→スタイル・スキル→体形→顔→髪型・ヒゲ→着こなしの順を基本とします。\n\n## 12．前チャットで使用した出典の引き継ぎ\n\n**以下は前チャットの回答に掲載されていた出典です。このファイル作成時点で、リンク先の内容や有効性を再確認したものではありません。** 能力値・顔の調整値の正確性を保証する出典ではなく、当時のプロフィールや成績の確認に使われたものです。\n\n### 1．Jリーグ公式サイト\n対象：2009年の成績・ベストイレブン、プレーの特徴、負傷歴\n\nhttps://www.jleague.jp/j-tano/1104/\n\n### 2．SAMURAI BLUE／日本代表の記録\n対象：2009年当時の身長175cm・体重69kg\n\nhttps://samuraiblue.jp/timeline/20091010/\n\n### 3．FC東京公式サイト\n対象：当時の背番号18\n\nhttps://www.fctokyo.co.jp/fan/fanzone/detail/290491/\n"}],"verification":{"in_game_ranges":"未確認","web_sources":"選手ごとに管理。石川は引き継ぎ・再検証未実施。梶山は2026-09-16にプロフィールと成績等を確認（sources.checked_for参照）。","ps4_reproduction":"未確認","reference_images":"AI参考画像。実機の再現結果ではない。","player_source_scope":{"naohiro-ishikawa-2009-fc-tokyo":"既存資料を保持。再検証なし。","yohei-kajiyama-2009-fc-tokyo":"新規作成。プロフィール・成績と外観資料を確認。ゲーム数値・顔の再現は未検証。","shingo-akamine-2012-vegalta-sendai":"v1.4.0新規登録。sources.checked_forとimages.reference_generationの範囲を確認。ゲーム設定の実機確認はなし。","mu-kanazaki-2016-kashima-antlers":"v1.4.0新規登録。sources.checked_forとimages.reference_generationの範囲を確認。ゲーム設定の実機確認はなし。","yuhei-tokunaga-2012-fc-tokyo":"v1.4.0新規登録。sources.checked_forとimages.reference_generationの範囲を確認。ゲーム設定の実機確認はなし。","yoichiro-kakitani-2013-cerezo-osaka":"v1.6.0新規登録。取得した一次資料の範囲をsourcesへ記録。当年未確認の体格は仮入力。能力と外見は実機未確認。","mike-havenaar-2015-16-ado-den-haag":"v1.6.0新規登録。取得した一次資料の範囲をsourcesへ記録。当年未確認の体格は仮入力。能力と外見は実機未確認。","ariajasuru-hasegawa-2013-fc-tokyo":"v1.6.0新規登録。取得した一次資料の範囲をsourcesへ記録。当年未確認の体格は仮入力。能力と外見は実機未確認。"},"uniform_images":"v1.3.2：両選手の2009年FC東京公式写真でユニフォームの外観を確認。既存のプロフィール・能力・顔設定の再検証とは区別。","new_players_1_4_0":"追加3名のプロフィール・成績・外観資料を確認。ゲーム能力・適性・スタイル・スキルは独自設定、顔・体形の入力範囲と再現結果は実機未確認。"},"display_preferences":{"theme":"japan-blue","show_assessment_badges":false,"show_caveats":false,"show_sources_and_verification":false,"show_image_disclaimer":false,"show_unset_overall_rating":false,"approved_reference_image_unchanged":false,"updated_by":"2026-09-16 ユーザー指示：スマホの選手名を姓・名の区切りで折り返し、一覧の紹介文とその余白を削除","precedence":"今回の表示指定を優先。選手データ内の元の注意書き・出典・画像区分は変更せず保持する。","reference_image_edit_scope":"uniform_only","show_card_image_year":false,"show_edit_notes":false,"card_name_wrap":"surname_and_given_name","show_list_tagline":false},"research_documents":[{"player_id":"yohei-kajiyama-2009-fc-tokyo","filename":"kajiyama-2009.md","content":"# 梶山陽平・2009年FC東京版の作成記録\n\n作成日：2026-09-16。ユーザーの「次はFC東京の梶山を登録したい」という指示に基づく新規登録。既存の石川直宏のデータを流用して再査定したものではありません。\n\n## 再現年度と基本情報\n\n2009年を選定。FC東京公式の年度別成績ではJ1に31試合出場・2得点。カップ戦では10試合出場・1得点。11月3日のナビスコカップ決勝で背番号10の先発MFとして出場し、チームは川崎に2対0で勝利しています。J1の主力として継続出場し、タイトルを獲得した時期の中盤の組み立て役を再現する選択です。「最も輝いた年」は図鑑作成上の選定であり、公式のランキングではありません。\n\n2009年の公式選手ページに基づく身長180cm・体重75kg・背番号10を採用。1985年9月24日生まれで、ナビスコカップ決勝時点の24歳に固定します。後年の73kgを混ぜていません。利き足の右はサッカーキングのプロフィールで確認しました。\n\n## プレーの再現方針\n\n中盤でボールを守り、短長のパスで味方を動かすCMF。ボールコントロール86、ボールキープ88、グラウンダーパス85、フライパス84を軸に、フィジカルコンタクト81で競り合いながら保持する特徴を出します。速さや得点力を同時に高くしすぎず、スピード72・瞬発力70・決定力68とします。\n\nポジション・ゲーム能力値・スタイル・スキルは今回作成した独自設定。資料に掲載された公式ゲーム数値ではありません。コンディション5・ケガ耐性2もゲーム内バランスのための設定であり、医学的判定や公式値ではありません。総合値は計算していないためnullです。\n\n体形・顔の数値は写真の特徴へ寄せるための開始値として個別に作成します。PS4実機での項目名・選択肢・数値範囲・再現結果は確認していません。顔パーツ種類番号はnullのまま保持し、未登録値を0で補完しません。\n\n## 参照先と確認範囲\n\n- [FC東京・2009年の梶山陽平プロフィール](https://www.fctokyo.co.jp/team/players/2009/296602/)：氏名、誕生日、背番号10、当時の身長180cm・体重75kgをページ本文で確認。\n- [FC東京・2018年選手ページ内の年度別成績](https://www.fctokyo.co.jp/team/players/2018/293472/)：2009年のJ1出場31・得点2、カップ出場10・得点1を確認。プレーの一般的特徴も参考にしたが、2018年の体重は使用していません。\n- [FC東京・2009年11月3日決勝の記録](https://www.fctokyo.co.jp/match/schedule/result/20091103/)：対戦相手、スコア、背番号10での先発出場を確認。\n- [Jリーグ・現役引退記事](https://www.jleague.jp/news/article/13289/)：2009年リーグカップ優勝への貢献を確認。\n- [東京都サッカー協会・本人インタビュー](https://www.tokyofa.or.jp/magazine/fanews/vol7/special1.html)：本人によるボール保持とゲームづくりの説明を参考にした。U-22時代の取材であり、2009年そのものの取材ではありません。\n- [サッカーキング・プロフィール](https://www.soccer-king.jp/player/article/416443.html)：利き足が右であることを確認。現在年齢の表示は再現年齢に使用していません。\n\nサイト画面ではユーザーの最新指示により注意書き・出典欄を表示しません。この作成記録とJSONに参照先と確認範囲を保持します。石川の出典について今回再検証したと扱わないでください。\n\n## 外観画像の作成\n\n公式2009年プロフィール写真（https://assets.fctokyo.co.jp/wp/wp-content/uploads/2026/01/2009_10.png?x64424= ）を目視確認し、束状のトップ、斜めの前髪、残した耳まわり・襟足、薄いひげを反映した想定3Dモデルを1回生成。1536×1024 PNGで正面と右向き横顔を配置しています。正面写真を基準とし、側面の形状はAIによる補完です。公式写真の撮影日は不記載で、URLにある2026/01を撮影年とは扱いません。\n"},{"player_id":"shingo-akamine-2012-vegalta-sendai","filename":"akamine-2012.md","content":"# 赤嶺 真吾・2012年ベガルタ仙台版の作成記録\n\n作成日：2026-09-16。ユーザー指定による新規追加。再現年度の選定とゲーム能力値は図鑑用の判断です。\n\n## 再現年度とプロフィール\n\nJ1で30試合14得点を記録し、仙台のリーグ2位に貢献。クロスへの入り方とヘディング、ゴール前での決定力が際立った時期を再現。\n\n身長・体重・背番号・生年月日は仙台の2012年公式プロフィール。28歳は2012年12月1日時点。利き足はサッカーキングで確認。\n\n## ゲーム内の設定方針\n\n中央でマークを外し、少ないタッチで仕留めるCF。ヘディング88・ジャンプ86・オフェンスセンス84を軸に、決定力82で得点力を表現。ドリブルや長いパスは控えめにする。\n\nメインポジション：CF。プレースタイル：ボックスストライカー。2トップの一角、または中央のCF。サイドからのクロスに対して、相手の前へ入る動きとゴール前の仕上げを重視。\n\n数値は資料の公式ゲームデータを転載したものではなく、今回個別に作成した設定です。PS4版ウイニングイレブン2020の実機で、入力範囲・スタイルの動作・顔の再現は未検証です。総合値と顔パーツ種類番号、記載していない細部調整はnullを保持し、0で補完しません。\n\n## 顔と髪型\n\n2012年公式年間MVP写真で髪型の輪郭を確認。顔の細部は2013年仙台公式プロフィールを補助に使用。2012年の鮮明な正面顔写真だけで確認できたものではない。\n\n横幅のある丸みを帯びた輪郭。頬に厚みを残し、太めの眉、小さめの横長の目、丸い鼻先、短めで幅のあるあごを合わせる。\n\n暗い茶色のストレートを中央付近で分け、長めの前髪を左右に下ろす。耳の大半を覆い、横髪と襟足をあごから首の上付近まで残す。\n\n## 参照先と確認範囲\n\n- [ベガルタ仙台・2012年公式プロフィール](https://www.vegalta.co.jp/backnumber/2012/top_team/player24.html)：生年月日・180cm/77kg・背番号24・所属\n- [Jリーグ公式データ・2012年仙台選手出場記録](https://data.j-league.or.jp/SS/jpn/team/2012010001_000105_W0707_J.html)：J1の30試合14得点／仙台の年間2位\n- [ベガルタ仙台・2012年鳥栖戦記録](https://vegalta.co.jp/backnumber/2012/league/2012j1-19.html)：ヘディングによる得点の記録\n- [サッカーキング・プロフィール](https://www.soccer-king.jp/player/article/413625.html)：利き足：右\n- [外観資料の確認記録](https://www.vegalta.co.jp/backnumber/2012/news/online_news/2012/11/post-337.html)：2012年公式年間MVP写真で髪型の輪郭を確認。顔の細部は2013年仙台公式プロフィールを補助に使用。2012年の鮮明な正面顔写真だけで確認できたものではない。\n- [ベガルタ仙台・2013年公式プロフィール](https://www.vegalta.co.jp/backnumber/2013/top_team/player24.html)：2012年の顔の細部を補うための、近接年2013年の正面写真。2012年の写真とは区別。\n\n注意書きと出典の画面表示は、ユーザーの既存指定に従い非表示。参照情報はこの記録と全選手JSONに保持します。既存の石川・梶山の設定を再査定したものではありません。\n\n\n## 参考画像の作成と確認\n\n正面・右向き横顔を等分した1536×1024 PNGを生成し、顔・髪型・当時のホーム用ユニフォームを目視確認。実機のレンダリングではありません。画像の出典、生成指示全文、確認範囲は全選手JSONの images.reference_generation に保存しています。\n\n- Official linked 2012 portrait returns 404; period hair is supported by the 2012-11-24 MVP photo, while facial structure is supplemented by the official 2013 portrait. No exact 2012 side-on studio portrait was available, so profile geometry is inferred.\n- AI-generated 3D interpretation, not a game-engine screenshot; kit sponsor/crest fine details are approximate.\n"},{"player_id":"mu-kanazaki-2016-kashima-antlers","filename":"kanazaki-2016.md","content":"# 金崎 夢生・2016年鹿島アントラーズ版の作成記録\n\n作成日：2026-09-16。ユーザー指定による新規追加。再現年度の選定とゲーム能力値は図鑑用の判断です。\n\n## 再現年度とプロフィール\n\nJ1で30試合10得点。チャンピオンシップ決勝第2戦では2得点を挙げ、鹿島の逆転優勝を決めた。力強い突破と勝負所でのフィニッシュを再現。\n\n180cm/70kg・背番号33・生年月日は2016年2月の鹿島公式加入発表。27歳は2016年12月3日時点。公式登録はMFだが、当季の起用を基にゲームのメイン位置はCFとする。後年の182cm/77kgは混ぜない。\n\n## ゲーム内の設定方針\n\n相手に体を当てられても前へ進み、裏へ飛び出して仕留めるFW。ドリブル84・瞬発力85・フィジカルコンタクト82・決定力83を中心に、スタミナ85で前線の運動量を表現。\n\nメインポジション：CF。プレースタイル：ラインブレイカー。2トップの一角を基本に、中央からサイドの空いた場所へ流れて受ける。登録CF以外の適性は再現用の設定。\n\n数値は資料の公式ゲームデータを転載したものではなく、今回個別に作成した設定です。PS4版ウイニングイレブン2020の実機で、入力範囲・スタイルの動作・顔の再現は未検証です。総合値と顔パーツ種類番号、記載していない細部調整はnullを保持し、0で補完しません。\n\n## 顔と髪型\n\n2016年12月8日の鹿島公式試合写真に写る本人の特徴を基にした開始値。正確なパーツ番号や入力範囲は実機未確認。\n\n縦に長めで引き締まった輪郭。はっきりした太い眉、細めの目、やや長い鼻筋、厚すぎない唇と輪郭の出たあごを合わせる。\n\n黒に近い長めの髪を後ろへ流し、細い黒のヘアバンドで額を出す。トップは自然に立ち上げ、耳の後ろと襟足に長さを残す。\n\n## 参照先と確認範囲\n\n- [鹿島アントラーズ・2016年加入発表](https://www.antlers.co.jp/blogs/news/53086)：生年月日・180cm/70kg・背番号33／当時の公式登録MF\n- [Football LAB・2016年選手データ](https://www.football-lab.jp/player/700751?year=2016)：30試合10得点／開始時ポジションがCFの先発30試合。ポジション分類はデータ提供者の判断\n- [Jリーグ公式・2016年CS決勝第2戦](https://www.jleague.jp/news/article/7724/)：決勝第2戦での2得点と鹿島の年間優勝\n- [サッカーキング・プロフィール](https://www.soccer-king.jp/player/article/415967.html)：利き足：右\n- [外観資料の確認記録](https://www.antlers.co.jp/blogs/games/51932)：2016年12月8日の鹿島公式試合写真に写る本人の特徴を基にした開始値。正確なパーツ番号や入力範囲は実機未確認。\n\n注意書きと出典の画面表示は、ユーザーの既存指定に従い非表示。参照情報はこの記録と全選手JSONに保持します。既存の石川・梶山の設定を再査定したものではありません。\n\n\n## 参考画像の作成と確認\n\n正面・右向き横顔を等分した1536×1024 PNGを生成し、顔・髪型・当時のホーム用ユニフォームを目視確認。実機のレンダリングではありません。画像の出典、生成指示全文、確認範囲は全選手JSONの images.reference_generation に保存しています。\n\n- Selected period likeness photo is a celebration in the 2016 away shirt; home clothing is separately grounded in the official 2016-03-05 home match photo of Ueda, used only for kit geometry.\n- Neutral frontal/profile face geometry is inferred from the identified period photo, not an exact 3D scan. AI-generated interpretation, not engine output; fine logos approximate.\n"},{"player_id":"yuhei-tokunaga-2012-fc-tokyo","filename":"tokunaga-2012.md","content":"# 徳永 悠平・2012年FC東京版の作成記録\n\n作成日：2026-09-16。ユーザー指定による新規追加。再現年度の選定とゲーム能力値は図鑑用の判断です。\n\n## 再現年度とプロフィール\n\nFC東京でJ1に31試合出場。オーバーエイジで臨んだロンドン五輪では日本の4位に貢献した。左右の守備に対応できる、対人の強さと安定感を再現。\n\n生年月日・180cm/76kg・28歳はJOCロンドン2012選手名鑑（2012年7月27日時点）。FC東京の年度別アーカイブは77kg表記だが、時点の明確な五輪資料を採用。背番号2とクラブ用ユニフォームはFC東京の2012年ページ。利き足はサッカーキングで確認。\n\n## ゲーム内の設定方針\n\n相手の仕掛けに粘り強く対応し、守備へ戻れるサイドバック。ディフェンスセンス81・ボール奪取80・スタミナ87を軸に、スピード80とフィジカルコンタクト80で広い範囲を支える。\n\nメインポジション：RSB。プレースタイル：守備的サイドバック。右サイドバックを基本に、左サイドにも対応。中央の守備は準適性とし、対人対応と守備の安定を重視。\n\n数値は資料の公式ゲームデータを転載したものではなく、今回個別に作成した設定です。PS4版ウイニングイレブン2020の実機で、入力範囲・スタイルの動作・顔の再現は未検証です。総合値と顔パーツ種類番号、記載していない細部調整はnullを保持し、0で補完しません。\n\n## 顔と髪型\n\nFC東京公式2012年プロフィール写真の特徴を基にした開始値。正確なパーツ番号や入力範囲は実機未確認。\n\nやや縦長で引き締まった輪郭。横に長い目、まっすぐな眉、通った鼻筋、細めのあごを合わせる。口ヒゲとあご先のヒゲも特徴にする。\n\n暗い茶色の短髪。トップを短い束で立たせ、額を出す。耳まわりは短く整え、長い襟足やヘアバンドは付けない。\n\n## 参照先と確認範囲\n\n- [JOC・ロンドン2012選手名鑑](https://www.joc.or.jp/games/olympic/london/sports/football/team/tokunagayuhei.html)：2012年7月27日時点の28歳・180cm/76kg・FC東京所属・生年月日\n- [FC東京・2012年公式プロフィール](https://www.fctokyo.co.jp/team/players/2012/296617/)：当時の背番号2と公式掲載写真／アーカイブの77kg表記。採用値76kgとの相違を記録\n- [JOC・オリンピック成績](https://www.joc.or.jp/athletes/yuheitokunaga/index.html)：ロンドン2012・男子4位\n- [FC東京・移籍発表内の代表歴](https://www.fctokyo.co.jp/news/details/304872/)：2012年五輪のオーバーエイジ枠。後年の体重は採用しない\n- [サッカーキング・プロフィール](https://www.soccer-king.jp/player/article/413879.html)：2012年J1の31試合1得点／利き足：右\n- [外観資料の確認記録](https://www.fctokyo.co.jp/team/players/2012/296617/)：FC東京公式2012年プロフィール写真の特徴を基にした開始値。正確なパーツ番号や入力範囲は実機未確認。\n\n注意書きと出典の画面表示は、ユーザーの既存指定に従い非表示。参照情報はこの記録と全選手JSONに保持します。既存の石川・梶山の設定を再査定したものではありません。\n\n\n## 参考画像の作成と確認\n\n正面・右向き横顔を等分した1536×1024 PNGを生成し、顔・髪型・当時のホーム用ユニフォームを目視確認。実機のレンダリングではありません。画像の出典、生成指示全文、確認範囲は全選手JSONの images.reference_generation に保存しています。\n\n- Roster content explicitly labels 2012 although its image was rehosted in a /2026/01/ asset directory. Neutral expression and exact profile geometry are inferred from the frontal smiling portrait.\n- AI-generated concept reference, not engine output; kit sponsor and crest fine details are approximate.\n"}],"reference_image_policy":{"uniform_club_field":"era.club","uniform_year_field":"era.year","uniform_variant":"home","uniform_instruction":"参考画像は再現年度に所属していたチームのホームユニフォームに合わせる。当時の公式写真等で服装を確認する。","preserve_on_uniform_edit":["顔の特徴","髪型","ヒゲ","構図","選手のゲーム設定値"],"updated_at":"2026-09-16T01:45:57.211255+00:00","requested_by":"ユーザーのユニフォーム変更指示"},"publication_request":{"provider":"GitHub","status":"awaiting_preview_review_and_repository","instruction":"追加3選手を確認し、問題なさそうならGitHubで公開したいというユーザー指示。公開先リポジトリは未指定。","date":"2026-09-16T02:15:38.246691+00:00"}}};function Q(e){return e.normalize(`NFKC`).toLowerCase().replace(/[ァ-ヶ]/g,e=>String.fromCharCode(e.charCodeAt(0)-96)).replace(/[\s\u3000・._-]/g,``)}function Wu(e,t,n){let r=Q(t.query),i=new Map(n.map(e=>[e.player_id,e.order]));return e.filter(e=>[e.name,e.name_kana,e.name_english,e.shirt_name,e.name_english.split(` `).reverse().join(` `)].some(e=>Q(e).includes(r))&&(t.club===`all`||e.era.club===t.club)&&(t.position===`all`||e.profile.main_position===t.position||e.positions.items.some(e=>e.position===t.position&&e.suitability!==`なし`))).sort((e,n)=>{let r=()=>e.name_kana.localeCompare(n.name_kana,`ja`)||e.era.year-n.era.year||e.id.localeCompare(n.id);return t.sort===`club`?e.era.club.localeCompare(n.era.club,`ja`)||r():(t.sort===`newest`||t.sort===`oldest`)&&((i.get(e.id)??0)-(i.get(n.id)??0))*(t.sort===`newest`?-1:1)||r()})}function Gu(e,t=!1){return e==null||e===``?`未確認`:typeof e==`boolean`?e?`ON`:`OFF`:typeof e==`number`&&t?e>0?`＋${e}`:e<0?`−${Math.abs(e)}`:`0`:S
